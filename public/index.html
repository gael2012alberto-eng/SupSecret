<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda - Gaming Platform</title>
    <style>
        :root {
            --primary-green: #00C853;
            --card-bg: #FFFFFF;
            --text-gray: #6C757D;
            --border-color: #E2E8F0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #E9ECEF;
            margin: 0;
            padding: 0;
            color: #333;
        }

        .screen {
            display: none;
            padding: 20px;
            padding-bottom: 80px;
        }

        .screen.active {
            display: block;
        }

        .welcome-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .welcome-box {
            text-align: center;
            width: 100%;
            max-width: 300px;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-white {
            background: #FFFFFF;
            color: #333;
        }

        .btn-green {
            background: var(--primary-green);
            color: #FFFFFF;
        }

        .footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-around;
        }

        .footer-links a {
            color: var(--text-gray);
            font-size: 12px;
            text-decoration: none;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .form-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-gray);
        }

        .form-card h2 {
            margin-top: 0;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-gray);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .gender-selector {
            display: flex;
            gap: 10px;
        }

        .gender-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .gender-option.boy-selected {
            background: #E3F2FD;
            border-color: #2196F3;
            color: #2196F3;
        }

        .gender-option.girl-selected {
            background: #FCE4EC;
            border-color: #E91E63;
            color: #E91E63;
        }

        .error-msg {
            color: #D32F2F;
            font-size: 12px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* PANTALLA PRINCIPAL */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-green);
        }

        .search-bar {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            width: 140px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .friends-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .friend-bubble {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-gray);
            flex-shrink: 0;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background: #CED4DA;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .game-thumb {
            width: 100%;
            height: 110px;
            background: #E9ECEF;
        }

        .game-info {
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            color: var(--text-gray);
            font-size: 11px;
            text-align: center;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--primary-green);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE BIENVENIDA -->
    <div id="welcomeScreen" class="screen active">
        <div class="welcome-container">
            <div class="welcome-box">
                <button class="btn-main btn-white" onclick="openModal('registerModal')">Crear cuenta</button>
                <button class="btn-main btn-green" onclick="openModal('loginModal')">Iniciar sesión</button>
                <div class="footer-links">
                    <a href="#">Términos</a>
                    <a href="#">Privacidad</a>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CREAR CUENTA -->
    <div id="registerModal" class="modal-overlay">
        <div class="form-card" id="registerCardTheme">
            <button class="close-btn" onclick="closeModals()">✕</button>
            <h2>Crear cuenta</h2>
            
            <div class="input-group">
                <label>Fecha de nacimiento</label>
                <input type="date" id="birthdateInput">
            </div>
            <div class="input-group">
                <label>Nombre de usuario</label>
                <input type="text" id="regUsername" placeholder="No utilices tu nombre real">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label>Género (Asigna personaje inicial)</label>
                <div class="gender-selector">
                    <div class="gender-option" id="genderBoy" onclick="selectGender('boy')">Niño</div>
                    <div class="gender-option" id="genderGirl" onclick="selectGender('girl')">Niña</div>
                </div>
            </div>

            <p class="error-msg" id="regError"></p>
            <button class="btn-main btn-green" style="width:100%; padding:12px;" onclick="handleRegister()">Continuar</button>
        </div>
    </div>

    <!-- MODAL DE INICIO DE SESIÓN -->
    <div id="loginModal" class="modal-overlay">
        <div class="form-card">
            <button class="close-btn" onclick="closeModals()">✕</button>
            <h2>Iniciar sesión</h2>
            
            <div class="input-group">
                <label>Usuario</label>
                <input type="text" id="loginUsername" placeholder="Tu usuario">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>

            <p class="error-msg" id="loginError"></p>
            <button class="btn-main btn-green" style="width:100%; padding:12px;" onclick="handleLogin()">Entrar</button>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="mainScreen" class="screen">
        <header>
            <div class="logo">Andromeda</div>
            <input type="text" class="search-bar" placeholder="Buscar juegos...">
        </header>

        <div class="section-title" id="welcomeUserTitle">Amigos en línea</div>
        <div class="friends-scroll">
            <div class="friend-bubble"><div class="avatar"></div>Gaelk</div>
            <div class="friend-bubble"><div class="avatar"></div>Alex</div>
            <div class="friend-bubble"><div class="avatar"></div>TokenX</div>
            <div class="friend-bubble"><div class="avatar"></div>Cyber</div>
            <div class="friend-bubble"><div class="avatar"></div>Neon</div>
        </div>

        <div class="section-title">Destacados para ti</div>
        <div class="games-grid">
            <div class="game-card">
                <div class="game-thumb"></div>
                <div class="game-info">Andromeda Tycoon</div>
            </div>
            <div class="game-card">
                <div class="game-thumb"></div>
                <div class="game-info">Neon Battle Arena</div>
            </div>
        </div>

        <nav>
            <a href="#" class="nav-item active">🏠<br>Inicio</a>
            <a href="#" class="nav-item" onclick="logout()">🚪<br>Salir</a>
        </nav>
    </div>

    <script>
        // Aquí se conectará automáticamente a tu app de Render cuando la crees (ej: https://andromeda.onrender.com)
        // Si pruebas en tu computadora localmente, puedes usar 'http://localhost:3000'
        const API_URL = ""; 

        let selectedGenderValue = '';

        function openModal(modalId) {
            closeModals();
            document.getElementById(modalId).classList.add('active');
        }

        function closeModals() {
            document.getElementById('registerModal').classList.remove('active');
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('regError').innerText = '';
            document.getElementById('loginError').innerText = '';
        }

        function selectGender(gender) {
            selectedGenderValue = gender;
            const cardTheme = document.getElementById('registerCardTheme');
            
            document.getElementById('genderBoy').classList.remove('boy-selected');
            document.getElementById('genderGirl').classList.remove('girl-selected');
            cardTheme.classList.remove('theme-boy', 'theme-girl');

            if(gender === 'boy') {
                document.getElementById('genderBoy').classList.add('boy-selected');
                cardTheme.classList.add('theme-boy');
            } else {
                document.getElementById('genderGirl').classList.add('girl-selected');
                cardTheme.classList.add('theme-girl');
            }
        }

        function calculateClassification(birthdateString) {
            const birthDate = new Date(birthdateString);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age < 18 ? 'e' : 'E';
        }

        async function handleRegister() {
            let birthdate = document.getElementById('birthdateInput').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            if(!birthdate || !username || !password || !selectedGenderValue) {
                document.getElementById('regError').innerText = "Completa todos los campos y selecciona el género.";
                return;
            }

            if (birthdate.includes('/')) {
                const parts = birthdate.split('/');
                if(parts.length === 3) {
                    birthdate = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
            }

            const classification = calculateClassification(birthdate);

            try {
                const res = await fetch(`${API_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, gender: selectedGenderValue, classification })
                });
                
                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("El servidor no devolvió una respuesta JSON válida.");
                }

                const data = await res.json();

                if(res.ok) {
                    alert(`¡Cuenta creada con éxito! Personaje inicial asignado (${selectedGenderValue === 'boy' ? 'Niño' : 'Niña'}). Inicia sesión.`);
                    closeModals();
                    openModal('loginModal');
                } else {
                    document.getElementById('regError').innerText = data.mensaje || "Error al registrar.";
                }
            } catch(err) {
                console.error(err);
                document.getElementById('regError').innerText = "Error de conexión con el servidor. Verifica que esté activo.";
            }
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if(!username || !password) {
                document.getElementById('loginError').innerText = "Ingresa usuario y contraseña.";
                return;
            }

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("El servidor no devolvió una respuesta JSON válida.");
                }

                const data = await res.json();

                if(res.ok) {
                    closeModals();
                    document.getElementById('welcomeScreen').classList.remove('active');
                    document.getElementById('mainScreen').classList.add('active');
                    document.getElementById('welcomeUserTitle').innerText = `¡Bienvenido, ${data.username}! (${data.gender === 'boy' ? 'Personaje Niño' : 'Personaje Niña'})`;
                } else {
                    document.getElementById('loginError').innerText = data.mensaje || "Credenciales incorrectas.";
                }
            } catch(err) {
                console.error(err);
                document.getElementById('loginError').innerText = "Error de conexión con el servidor.";
            }
        }

        function logout() {
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('welcomeScreen').classList.add('active');
        }
    </script>
</body>
                      </html>
