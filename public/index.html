<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andromeda</title>
    <style>
        /* Fondo animado degradado en verde clarito y blanco */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #ffffff, #c8e6c9, #f1f8e9);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        /* Pantalla de bienvenida / Login */
        #auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 90vh;
            text-align: center;
        }

        .btn {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            margin: 10px 0;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-white {
            background-color: #ffffff;
            color: #2e7d32;
            border: 2px solid #a5d6a7;
        }

        .btn-green {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
        }

        /* Dashboard principal */
        #app-screen {
            display: none;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1.logo {
            color: #2e7d32;
            font-size: 24px;
            margin: 0;
        }

        .search-box {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #c8e6c9;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            outline: none;
            font-size: 14px;
            width: 150px;
        }

        .welcome-text {
            font-weight: 600;
            color: #4f5d53;
            margin-bottom: 15px;
            font-size: 15px;
        }

        /* Avatares / Stickers mejorados */
        .avatars-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .avatars-container::-webkit-scrollbar {
            display: none;
        }

        .avatar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .avatar-circle {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a5d6a7, #81c784);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(46, 125, 50, 0.15);
            border: 2px solid #ffffff;
            transition: transform 0.2s;
        }

        .avatar-item:hover .avatar-circle {
            transform: scale(1.05);
        }

        .avatar-name {
            font-size: 12px;
            margin-top: 6px;
            color: #388e3c;
            font-weight: bold;
        }

        /* Tarjetas destacadas */
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin: 25px 0 12px 0;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0f2f1;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-img {
            width: 100%;
            height: 90px;
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Barra de navegación inferior */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #c8e6c9;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: bold;
            color: #2e7d32;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio de Sesión -->
    <div id="auth-screen" class="container">
        <h1 style="color: #2e7d32; margin-bottom: 30px; font-size: 32px;">Andromeda</h1>
        <button class="btn btn-white" onclick="showApp()">Crear cuenta</button>
        <button class="btn btn-green" onclick="showApp()">Iniciar sesión</button>
        <div style="margin-top: 25px; font-size: 12px; color: #666;">
            <span style="margin: 0 10px; cursor:pointer;">Términos</span> • 
            <span style="margin: 0 10px; cursor:pointer;">Privacidad</span>
        </div>
    </div>

    <!-- Pantalla Principal de Juegos / Dashboard -->
    <div id="app-screen" class="container" style="display: none; padding-bottom: 80px;">
        <div class="header-flex">
            <h1 class="logo">Andromeda</h1>
            <input type="text" class="search-box" placeholder="Buscar juegos...">
        </div>

        <div class="welcome-text">¡Bienvenido, CEO! (Personaje Niño)</div>

        <!-- Avatares / Stickers con estilo circular llamativo -->
        <div class="avatars-container">
            <div class="avatar-item">
                <div class="avatar-circle">👦</div>
                <div class="avatar-name">Gaelk</div>
            </div>
            <div class="avatar-item">
                <div class="avatar-circle">🤖</div>
                <div class="avatar-name">Alex</div>
            </div>
            <div class="avatar-item">
                <div class="avatar-circle">⚡</div>
                <div class="avatar-name">TokenX</div>
            </div>
            <div class="avatar-item">
                <div class="avatar-circle">🚀</div>
                <div class="avatar-name">Cyber</div>
            </div>
            <div class="avatar-item">
                <div class="avatar-circle">💎</div>
                <div class="avatar-name">Neon</div>
            </div>
        </div>

        <div class="section-title">Destacados para ti</div>

        <div class="cards-grid">
            <div class="card">
                <div class="card-img">🎮</div>
                <div class="card-title">Andromeda Tycoon</div>
            </div>
            <div class="card">
                <div class="card-img">⚔️</div>
                <div class="card-title">Neon Battle Arena</div>
            </div>
        </div>
    </div>

    <!-- Menú Inferior -->
    <div class="nav-bar" id="nav-menu" style="display: none;">
        <button class="nav-item" onclick="showApp()">🏠 Inicio</button>
        <button class="nav-item" onclick="logout()" style="color: #d32f2f;">🚪 Salir</button>
    </div>

    <script>
        function showApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('nav-menu').style.display = 'flex';
        }

        function logout() {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('nav-menu').style.display = 'none';
        }
    </script>
</body>
</html>
